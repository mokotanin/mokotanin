name: Update Contributions

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install requests

      - name: Update contributions
        env:
          GITHUB_USERNAME: mokotanin
          GITHUB_TOKEN: ${{ secrets.G_PAT }}
        run: python scripts/update_contributions.py
