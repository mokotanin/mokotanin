name: Update Contributions

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.G_PAT }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install requests
        run: pip install requests

      - name: Update contributions
        env:
          GITHUB_USERNAME: mokotanin
          GITHUB_TOKEN: ${{ secrets.G_PAT }}
        run: python scripts/update_contributions.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "Update contributions counter"
          git push https://${{ secrets.G_PAT }}@github.com/${{ github.repository }}.git HEAD:main
